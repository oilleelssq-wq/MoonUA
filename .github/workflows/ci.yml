name: CI

on:
  push:
  pull_request:

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: moon version --all
      - name: Update index
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Check
        run: moon check --deny-warn
      - name: Test
        run: moon test --deny-warn
      - name: Test wasm
        run: moon test --target wasm
      - name: Build example
        run: moon build examples/nodeid_demo --target wasm-gc
